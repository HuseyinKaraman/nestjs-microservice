apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: reservations
  name: reservations
spec:
  replicas: 1
  selector:
    matchLabels:
      app: reservations
  template:
    metadata:
      labels:
        app: reservations
    spec:
      containers:
      - image: reservations:latest
        imagePullPolicy: Never
        name: reservations
        env:
        - name: MONGODB_URI
          valueFrom:
            secretKeyRef:
              name: mongodb
              key: connectionString
        - name: PORT
          value: "3001"
        - name: AUTH_HOST
          value: auth-tcp
        - name: AUTH_PORT
          value: "3002"
        - name: PAYMENTS_HOST
          value: payments
        - name: PAYMENTS_PORT
          value: "3003"
        ports:
          - containerPort: 3001
